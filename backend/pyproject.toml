[project]
name = "randomconnect-backend"
version = "0.1.0"
description = "FastAPI backend for RandomConnect"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fastapi", "websocket", "webrtc", "mongodb", "oauth"]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.1.0",
    "passlib[bcrypt]>=1.7.0",
    "motor>=3.7.1",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
